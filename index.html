function getMonsterEvadeRate(){

    if(currentMapIndex < 6){
        return 0.30; // エリア1 30%
    }
    else if(currentMapIndex < 12){
        return 0.40; // エリア2 40%
    }
    else if(currentMapIndex < 18){
        return 0.50; // エリア3 50%
    }
    else if(currentMapIndex < 24){
        return 0.60; // エリア4 60%
    }
    else{
        return 0.70; // エリア5 70%
    }
}
function getHitRate(){

    const evadeRate = getMonsterEvadeRate();

    let hitRate = 1 - evadeRate + (lv * 0.02);

    if(hitRate > 0.95){
        hitRate = 0.95;
    }

    return hitRate;
}

function toggleSound() {

    isSoundOn = !isSoundOn;

    const btn =
    document.getElementById("sound-toggle");

    btn.innerText =
    isSoundOn
        ? "🔊 SOUND ON"
        : "🔇 SOUND OFF";

    document
        .querySelectorAll("audio")
        .forEach(audio => {
            audio.muted = !isSoundOn;
        });

}
function shakeMonster() {
    monsterImg.classList.remove("shake");
    void monsterImg.offsetWidth;
    monsterImg.classList.add("shake");
}

function updateMonsterBackground() {
// お城にいる場合
if(castleMode){
monsterArea.style.backgroundImage =
"url('img/castle_bg.jpg')";
return;
}

// 神殿
if(currentMapIndex === 29){
monsterArea.style.backgroundImage =
"url('img/bg_boss.jpg')";
return;
}
    if(bossBattle){

        monsterArea.style.backgroundImage =
        "url('img/temple_map_bg.jpg')";
        return;
    }

    if(currentMapIndex < 6){

        monsterArea.style.backgroundImage =
        "url('bg_forest.jpg')";
    }
    else if(currentMapIndex < 12){

        monsterArea.style.backgroundImage =
        "url('bg_cave.jpg')";
    }
    else if(currentMapIndex < 18){

        monsterArea.style.backgroundImage =
        "url('bg1-1.jpg')";
    }
    else if(currentMapIndex < 24){

        monsterArea.style.backgroundImage =
        "url('bg_snow.jpg')";
    }
    else if(currentMapIndex === 29){

        "url('bg_boss.jpg')";
    }
    else{

        monsterArea.style.backgroundImage =
        "url('bg_demon.jpg')";
    }
}

function movePlayer(dx,dy){
    if(eventMode) return;
    if(inBattle) return;

    if(dx < 0) direction = "left";
    if(dy < 0) direction = "up";
    if(dy > 0) direction = "down";

    const nx = player.x + dx;
    const ny = player.y + dy;

    ny < 0 ||
    ny >= map.length ||
    nx < 0 ||
    nx >= map[0].length
){
 
        return;

}
if(
    map[ny][nx] === 0 ||
    map[ny][nx] === 3 ||
    map[ny][nx] === 4 ||
    map[ny][nx] === 5 ||
    map[ny][nx] === 6 ||
    map[ny][nx] === 7 ||

}

// 仲間を追従させる
party.forEach((friend, i) => {

});

        if(party.length < 1){

            return;
        }

            shopMsg("お<ruby>金<rt>かね</rt></ruby>が<ruby>足<rt>た</rt></ruby>らないよ");
            return;
        }
        seBuy.currentTime = 0;
        seBuy.play();
        money -= 300;
        healCount++;
        shopMsg("🦦 <ruby>回復<rt>かいふく</rt></ruby>を<ruby>購入<rt>こうにゅう</rt></ruby>しました！");
    }

    else if(type==="change"){

        if(party.length < 2){
            shopMsg("<ruby>使<rt>つか</rt></ruby>える人がいないみたいだよ。");
            return;

shopMsg("🐋 <ruby>問題変更<rt>もんだいへんこう</rt></ruby>を<ruby>購入<rt>こうにゅう</rt></ruby>しました！");

    }

            return;
        }

        if(money < 500){

        }

     hintCount++;

                    exp += 500;   // ←経験値500追加

                        }
                    ]);

                    return;
                }


                // ====================================
                // ガーディアン戦クリア
                // ====================================
                audio.pause();
                audio.currentTime = 0;

                bossBgm.pause();
                bossBgm.currentTime = 0;

                endingBgm.currentTime = 0;
                endingBgm.play();

                startEnding();

                return;
            }


            // ----------------------------------------
            // ボスにダメージ
            // ----------------------------------------
            textEl.innerHTML =
                `<span style="color:#ff0">
                    ${kingBattle ? "王様" : "ガーディアン"}にダメージ！<br>
                    ${bossStreak}/5
                </span>`;

            seHit.currentTime = 0;
            seHit.play();

            setTimeout(() => {
                loadQuestion();
            }, 1200);

            return;
        }


        // ========================================
        // 通常モンスター戦
        // ========================================

        const hitRate = getHitRate();


        // ----------------------------------------
        // 正解したけど攻撃が外れる
        // ----------------------------------------
        if (Math.random() > hitRate) {
           seMissHit.currentTime = 0;
           seMissHit.play();
            textEl.innerHTML =
                `
                <span style="color:#ff0">
                    <ruby>正解<rt>せいかい</rt></ruby>した！<br>
                    しかし<ruby>相手<rt>あいて</rt></ruby>は
                    <ruby>納得<rt>なっとく</rt></ruby>しない！
                </span>
                `;

            setTimeout(() => {
                loadQuestion();
            }, 1200);

            return;
        }


        // ========================================
        // 通常モンスター撃破
        // ========================================

        let reward = getExpReward();

        if(hasBunchoMage){
            reward *= 2;
            }

        exp += reward;

        battleWin = true;

        battleBgm.pause();
        bossBgm.pause();

        seDamage.currentTime = 0;
        seDamage.play();


        // 経験値・レベル更新
        updateStats();


        // 勝利BGM
        setTimeout(() => {

            winBgm.currentTime = 0;
            winBgm.play();

        }, 500);


        textEl.innerHTML =
            `
            <span style="color:#0f0">
                せいかい！
                ${currentMonsterName} は納得した！<br>

                <ruby>経験値<rt>けいけんち</rt></ruby>を
                ${reward}
                <ruby>獲得<rt>かくとく</rt></ruby>！
            </span>
            `;


        // モンスターを消す
        document.getElementById("monster-img").style.display = "none";


        // スキルボタンを消す
        document.getElementById("skillButtons").style.display = "none";


        // 勝利画像
        document.getElementById("options").innerHTML =
            `
            <img
                src="${getWinImage()}"
                class="win-image float"
            >
            `;


        updateStats();

        return;
    }


    // ========================================
    // 不正解
    // ========================================
    else {
monsterArea.classList.remove("damageFlash");
void monsterArea.offsetWidth;
monsterArea.classList.add("damageFlash");

        hp -= 5;


        // ========================================
        // ボス戦の反撃
        // ========================================
        if (bossBattle) {

            bossStreak = 0;

            textEl.innerHTML =
                `
                <span style="color:#f00">
                    ${kingBattle ? "王様" : "ガーディアン"}の反撃！<br>
                    正解：${correct}
                </span>
                `;

        }


        // ========================================
        // 通常戦
        // ========================================
        else {

            textEl.innerHTML =
                `
                <span style="color:#f00">
                    ミス！5ダメージ<br>
                    正解：${correct}
                </span>
                `;
        }


        // ダメージSE
        seDamage.currentTime = 0;
        seDamage.play();


        // ========================================
        // ゲームオーバー
        // ========================================
        if (hp <= 0) {

            alert("目の前が真っ暗になった...");

            hp = 100;
            exp = 0;
            lv = 1;

            bossBattle = false;
            kingBattle = false;
            bossStreak = 0;
            inBattle = false;

            bossBgm.pause();
            bossBgm.currentTime = 0;

            audio.pause();
            audio.currentTime = 0;

            returnToField();

            return;
        }


        // ステータス更新
        updateStats();


        // 次の問題
        setTimeout(() => {
            loadQuestion();
        }, 1200);

        return;
    }
